name: Release NAI plugin package

# Push a tag like v1.52.1-nai4 and this workflow builds the importable
# Krita plugin zip and publishes it as a GitHub Release automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bundled websockets library is a git submodule. Without it the zip
      # imports fine as source but Krita refuses to load the plugin with
      # "Could not find websockets module". debugpy is intentionally left out.
      - name: Fetch websockets submodule
        run: git submodule update --init --depth 1 ai_diffusion/websockets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin package
        id: build
        run: |
          SUFFIX="${GITHUB_REF_NAME##*-}"   # v1.52.1-nai4 -> nai4
          ZIP=$(python scripts/package_nai.py "$SUFFIX")
          # The in-app updater fetches this sidecar to check the download is intact.
          (cd "$(dirname "$ZIP")" && sha256sum "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP" "$ZIP.sha256"

      - name: Create release with package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip }}.sha256
          generate_release_notes: true
          body: |
            NovelAI 版 Krita AI Diffusion 插件。

            **安装:** 下载下方的 zip,在 Krita 里选 工具 → 脚本 → 从文件导入 Python 插件,
            选择该 zip 并重启 Krita。配置方法见仓库 README_NAI.md。
